[project]
name = "phisim"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "qrcode[pil]>=8.2",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
phisim = "scripts.runners:phisim"
dev = "scripts.runners:dev"
test = "scripts.runners:test"
lint = "scripts.runners:lint"
format = "scripts.runners:format"
typecheck = "scripts.runners:typecheck"
check = "scripts.runners:check"
clean = "scripts.runners:clean"

[tool.fastapi]
entrypoint = "phisim.main:app"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/phisim",
    "scripts",
    "web",
    "scenarios",
]
sources = [
    "src",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
