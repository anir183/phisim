{% extends "shell.html" %}

{% block content %}
  <main class="{% block page_class %}page-frame{% endblock %}">
    {% block simulation_header %}{% endblock %}
    {% block simulation_content %}{% endblock %}
  </main>
  <footer class="page-frame" style="padding-top: 0; padding-bottom: 2rem">
    <p class="help-text" style="text-align: center">
      {% block simulation_footer %}This is a fictional local training experience.{% endblock %}
    </p>
  </footer>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='simulation.js') }}" defer></script>
{% endblock %}
