<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Fictional product{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='phisim.css') }}" />
  </head>
  {% set active_theme = site_theme|default(None) %}
  <body class="victim-body product-victim{% if active_theme %} mock-site mock-{{ active_theme.key }}{% endif %}">
    <div class="victim-shell product-document" data-victim-token="{{ attack.victim_token }}" data-attack-id="{{ attack.attack_id }}">
      {% block site_chrome %}{% endblock %}
      <main class="victim-product-main">
        {% block victim_content %}{% endblock %}
      </main>
      <div class="product-local-marker">Fictional local training site · no external account or service is contacted</div>
      <script src="{{ url_for('static', path='victim.js') }}" defer></script>
    </div>
  </body>
</html>
